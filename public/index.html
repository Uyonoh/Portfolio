<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap & Devicons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css"
      rel="stylesheet"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- AOS CSS -->
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet" />

    <!-- Core SEO & Title Tag Optimization -->
    <title>
      Uyonoh – Full-Stack Web Developer, Python Engineer & GIS Analyst
    </title>
    <meta
      name="description"
      content="A passionate Full-Stack Web Developer, Python Engineer, and GIS Analyst building intelligent, data-driven applications. Portfolio includes AI, ML, and geospatial projects."
    />
    <meta name="author" content="Uyonoh" />
    <link rel="canonical" href="https://uyonoh.com/" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="Uyonoh" />
    <meta property="og:title" content="Uyonoh's Full-Stack & GIS Portfolio" />
    <meta
      property="og:description"
      content="Building the future with code and innovation: Python, React, Django, ML, and Geospatial solutions."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://uyonoh.com/" />
    <meta
      property="og:image"
      content="https://uyonoh.com/assets/images/projects/portfolio.png"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Uyonoh's Full-Stack & GIS Portfolio" />
    <meta
      name="twitter:description"
      content="Building the future with code and innovation: Python, React, Django, ML, and Geospatial solutions."
    />
    <meta
      name="twitter:image"
      content="https://uyonoh.com/assets/images/projects/portfolio-dark.png"
    />
    <meta name="twitter:creator" content="@uyonoh" />

    <!-- Structured Data (Cleaned JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://uyonoh.com/#website",
            "name": "Uyonoh",
            "alternateName": ["Uyonoh's Portfolio", "Uyonoh - Portfolio"],
            "url": "https://uyonoh.com/",
            "publisher": { "@id": "https://uyonoh.com/#person" }
          },
          {
            "@type": "Person",
            "@id": "https://uyonoh.com/#person",
            "name": "Uyonoh",
            "url": "https://uyonoh.com/",
            "jobTitle": "Full-Stack Web Developer, Python Engineer & GIS Analyst",
            "sameAs": [
              "https://github.com/uyonoh",
              "https://x.com/uyonoh",
              "https://www.linkedin.com/in/uyonoh",
              "https://www.facebook.com/uyonoh.turaki/",
              "https://www.researchgate.net/profile/Uyonoh-Turaki",
              "https://www.fiverr.com/uyonoh"
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>
    <!-- <script src="%PUBLIC_URL%/scripts/bootstrap-5.5.3-dist/js/bootstap.bundle.min.js" type="text/JavaScript"></script> -->
    <script
      src="%PUBLIC_URL%/scripts/script.js"
      type="text/JavaScript"
      defer
    ></script>
    <!-- AOS JS -->
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script>
      AOS.init({
        duration: 800, // animation duration in ms
        // offset: 50,     // offset (px) from trigger point
        // once: false       // whether animation should happen only once
      });
      AOS.refresh();
    </script>
  </body>
</html>
